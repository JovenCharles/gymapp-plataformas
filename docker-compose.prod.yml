services:
  database:
    image: postgres:16-alpine
    container_name: gym-database-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: gymapp
      POSTGRES_USER: postgres_bdd
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

  backend:
    image: jovencharles/gymaster-backend:latest
    container_name: gym-backend-prod
    restart: unless-stopped
    depends_on:
      - database
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Host=database;Port=5432;Database=gymapp;Username=postgres_bdd;Password=postgres123"
      Jwt__Key: "clave_super_segura_para_gymaster_demo_123456789"
    ports:
      - "5009:8080"

  frontend:
    image: jovencharles/gymaster-frontend:latest
    container_name: gym-frontend-prod
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  postgres_data_prod: