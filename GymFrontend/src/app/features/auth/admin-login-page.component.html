<section class="login-page">
  <div class="login-card">
    <header>
      <h1>GyKete</h1>
      <p>Portal administrativo</p>
    </header>

    <form (ngSubmit)="enter()">
      <div class="field">
        <label for="username">Usuario</label>
        <input
          id="username"
          type="text"
          placeholder="Ingresa tu usuario"
          [(ngModel)]="username"
          name="username"
          autocomplete="username"
          required
        />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          placeholder="Ingresa tu contraseña"
          [(ngModel)]="password"
          name="password"
          autocomplete="current-password"
          required
        />
      </div>

      <p *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </p>

      <app-ui-button
        type="submit"
        size="lg"
        [fullWidth]="true"
        [disabled]="isLoading"
      >
        {{ isLoading ? 'Ingresando...' : 'Ingresar como administrador' }}
      </app-ui-button>
    </form>

    <p class="support">
      ¿No eres administrador?
      <a routerLink="/login">Volver al acceso de usuarios</a>
    </p>
  </div>
</section>
