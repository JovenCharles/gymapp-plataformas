<section class="panel blocks-section">
  <div class="blocks-header">
    <div>
      <h3>Próximos bloques libres</h3>
      <p>Horarios disponibles para reserva hoy en Sala de Pesas.</p>
    </div>

    <a routerLink="/schedules" class="link-reset">
      <app-ui-button variant="secondary" size="sm">
        Ver agenda completa
      </app-ui-button>
    </a>
  </div>

  <article
    class="block-item"
    *ngFor="let block of upcomingBlocks; let i = index"
    [class.block-item--accent]="i === 0"
  >
    <div class="block-item__date">{{ block.date }}</div>

    <div class="block-item__content">
      <h4>{{ block.activity }}</h4>
      <p>{{ block.time }}</p>
    </div>

    <a routerLink="/schedules" class="link-reset">
      <app-ui-button [disabled]="!block.enabled">
        Reservar
      </app-ui-button>
    </a>
  </article>
</section>
