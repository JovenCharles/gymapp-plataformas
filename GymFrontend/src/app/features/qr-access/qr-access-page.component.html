<section class="page-shell qr-page">
  <header class="qr-header">
    <h1>Access Pass</h1>
    <p>Escanea este código en el tótem de entrada</p>
  </header>

  <article class="qr-card panel">
    <div class="qr-card__status">
      <app-status-badge label="Habilitado" tone="success" />
    </div>

    <div class="qr-frame">
      <div class="qr-pixel"></div>
    </div>

    <h2>{{ auth.activeProfile().name }}</h2>
    <p class="rut-pill">{{ auth.isAdmin() ? auth.activeProfile().code : mockData.profileData.studentId }}</p>
    <p class="refresh">Auto actualiza cada 30s</p>
  </article>

  <p class="help-link">¿Problemas con el escáner?</p>
</section>
