<div class="shell">
  <div class="shell__overlay" *ngIf="mobileMenuOpen()" (click)="closeMobileMenu()"></div>

  <app-sidebar
    [platformName]="mockData.platformName"
    [platformSubtitle]="mockData.platformSubtitle"
    [userNav]="mockData.userNav"
    [adminNav]="visibleAdminNav()"
    [profileName]="sidebarProfile().name"
    [profileRole]="sidebarProfile().roleLabel"
    [profileCode]="sidebarProfile().code"
    [open]="mobileMenuOpen()"
    (navigated)="closeMobileMenu()"
  />

  <div class="shell__content">
    <header class="mobile-header">
      <button type="button" class="mobile-header__menu" (click)="toggleMobileMenu()">Menu</button>
      <p>{{ mockData.platformName }}</p>
      <small>{{ sidebarProfile().roleLabel }}</small>
    </header>

    <main class="shell__page">
      <router-outlet />
    </main>
  </div>
</div>
