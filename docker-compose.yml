services:
  database:
    image: postgres:14
    container_name: gym-database
    environment:
      POSTGRES_DB: gymapp
      POSTGRES_USER: postgres_bdd
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./GymBackend
      dockerfile: Dockerfile
    container_name: gym-backend
    ports:
      - "5008:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Jwt__Key=gymaster-development-key-change-in-production-2026
      - ConnectionStrings__DefaultConnection=Host=database;Port=5432;Database=gymapp;Username=postgres_bdd;Password=postgres123
    depends_on:
      - database

  frontend:
    build:
      context: ./GymFrontend
      dockerfile: Dockerfile
    container_name: gym-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
