services:
  backend:
    build:
      context: ./GymBackend
      dockerfile: Dockerfile
    container_name: gym-backend
    ports:
      - "5008:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080

  frontend:
    build:
      context: ./GymFrontend
      dockerfile: Dockerfile
    container_name: gym-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend